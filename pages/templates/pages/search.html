{% extends "base.html" %}

{% block title %}Search results{% endblock %}

{% block content %}

<div id="lit-search">
    <form method="get" action="{% url 'search' %}" id="lit-search-form" name="lit_search_form">
        <input id="lit-search-input" name="q" type="text" placeholder="Search all references" value="{{ query }}" />
        <input id="lit-search-button" type="submit" value="Search" />
    </form>
    <div style="clear:both;"></div>
</div>

{% if query %}
    <div id="lit-search-results-note">
        Search across titles, abstracts, and (where available) the full
        article text. Author last-name typos are matched fuzzily.
    </div>
    {% include "items/entries_list.html" %}
{% endif %}

{% endblock %}
