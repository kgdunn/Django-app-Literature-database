# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

# Two classes of files are excluded from every hook:
#
# 1. Django-generated migrations — tracked verbatim from `makemigrations`;
#    we don't want black / isort / flake8 / mypy bickering about their style
#    (e.g. line length on long auto-generated CreateModel calls, or isort
#    rearranging the `from django.db import migrations, models` block).
# 2. Vendored third-party minified JS (issue #79) — checked in byte-for-byte
#    from upstream so they match the SHA-256s recorded in
#    literature/static/literature/vendor/README.md. trailing-whitespace /
#    end-of-file-fixer would mutate them (the minified bundles ship with no
#    trailing newline), breaking that fidelity, so they're excluded wholesale.
#
# The global exclude applies to every hook, so the previous per-hook
# `exclude:` on mypy is no longer needed.
exclude: ^(items|tagging|pagehit)/migrations/|^literature/static/literature/vendor/.*\.js$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-case-conflict
      - id: check-docstring-first
      - id: debug-statements
      - id: detect-private-key
      - id: detect-aws-credentials
        args: [--allow-missing-credentials]
      - id: forbid-new-submodules
      - id: end-of-file-fixer
      - id: check-added-large-files
        args: ['--maxkb=5000']
      - id: check-merge-conflict

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        args: [--ignore-missing-imports]
        additional_dependencies:
          - types-bleach

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        # `--profile black` clamps line_length to black's default (88).
        # Pass --line-length explicitly so isort matches our 120-char convention.
        args: ["--profile", "black", "--line-length", "120"]

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        # Reads [tool.black] line-length=120 from pyproject.toml.

  - repo: https://github.com/asottile/blacken-docs
    rev: 1.19.1
    hooks:
      - id: blacken-docs
        args: ["--line-length", "120"]

  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
