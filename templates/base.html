<!doctype html>
<html lang="en">
<head>
{% load static %}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Theme-preload runs synchronously before any stylesheet so the
     requested theme is applied before paint (FOUC mitigation). Issue
     #80 extracted this from an inline <script> so the CSP can drop
     'unsafe-inline' from script-src. -->
<script src="{% static 'literature/theme-preload.js' %}"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@500;600&display=swap">

<link rel="stylesheet" href="{% static 'literature/site.css' %}">
<title>{% block title %}{% endblock %} | Literature</title>
</head>
<body>
<header class="site-header">
    <div class="site-header__inner">
        <a class="site-title" href="{% url 'lit-main-page' %}">Literature<span class="site-title__dot">·</span>LearnChE</a>
        <button id="theme-toggle" type="button" class="theme-toggle"
                aria-label="Toggle color theme" title="Theme: light / dark / auto">
            <span class="theme-toggle__icon" aria-hidden="true"></span>
            <span class="theme-toggle__label">Auto</span>
        </button>
    </div>
</header>
<main class="page-container">
{% block body %}
{% block content %}{% endblock %}
{% endblock %}
</main>
<footer class="site-footer">
    <p><a href="{% url 'lit-about-page' %}">About this site</a> &middot; Site sponsor: <a href="https://learnche.org">LearnChE.org</a> &middot; &copy; 2010 &ndash; {% now "Y" %} All rights reserved.</p>
</footer>

<!--
  MathJax 3 (SVG output), self-hosted under /static (issue #79) so the CSP
  keeps script-src 'self' with no third-party CDN allowance. The config
  must load before the bundle; both are local files (no inline <script>,
  no SRI needed for same-origin assets). See
  literature/static/literature/vendor/README.md for provenance + the
  v2.7.9 -> v3.2.2 rationale.
-->
<script src="{% static 'literature/mathjax-config.js' %}"></script>
<script src="{% static 'literature/vendor/tex-mml-svg.js' %}" async></script>

<script src="{% static 'literature/theme-toggle.js' %}"></script>
{{ANALYTICS_SNIPPET|safe}}
</body>
</html>
