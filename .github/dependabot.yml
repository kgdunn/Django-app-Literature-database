# Dependabot config — weekly bumps for SHA-pinned third-party actions,
# digest-pinned Docker base images, and Python runtime / dev deps. Pin
# locations:
#   .github/workflows/ci.yml   (actions/checkout, astral-sh/setup-uv,
#                               postgres:16-alpine service container)
#   Dockerfile                 (python:3.14-slim — digest-pinned PR #87,
#                               issue #70)
#   docker-compose.yml         (postgres:16-alpine)
#   docker-compose.prod.yml    (postgres:16-alpine)
#   pyproject.toml + uv.lock   (Django, psycopg[binary], gunicorn,
#                               bleach, pdfplumber, django-axes, +
#                               dev group). Issue #81 added the `pip`
#                               ecosystem so transitive-CVE bumps no
#                               longer wait on a manual ``uv lock
#                               --upgrade`` from a maintainer.
# CI catches breakage before merge.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  # Issue #81. Dependabot reads pyproject.toml + uv.lock under the
  # ``pip`` ecosystem. ``uv`` is the install tool; the dep manifest
  # itself is standard PEP-621, which is what Dependabot parses.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
