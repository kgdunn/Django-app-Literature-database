[project]
name = "literature"
version = "1.0.0"
description = "The Django site behind https://literature.learnche.org — a personal literature catalogue."
requires-python = ">=3.11"
dependencies = [
    "django>=5.2,<5.3",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "gunicorn>=22.0",
    "bleach>=6.3.0",
    "pdfplumber>=0.11",
    # Per-account admin login throttling — issue #74. ``axes`` ships
    # its own migrations that ``manage.py migrate`` will pick up;
    # settings live in ``literature/settings/base.py`` (``AXES_*``).
    "django-axes>=8.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-django",
    "mypy",
    "pre-commit",
    "pip-audit",
    "types-bleach",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "literature.settings.dev"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "-ra"
