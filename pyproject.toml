[project]
name = "literature"
version = "0.1.0"
description = "The Django site behind https://literature.learnche.org — a personal literature catalogue."
requires-python = ">=3.11"
dependencies = [
    "django>=5.2,<5.3",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "gunicorn>=22.0",
    "bleach>=6.1",
    "pdfplumber>=0.11",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-django",
    "mypy",
    "pre-commit",
    "pip-audit",
    "types-bleach",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "literature.settings.dev"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "-ra"
